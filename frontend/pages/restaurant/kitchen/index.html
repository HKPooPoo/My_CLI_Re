<!DOCTYPE html>
<html lang="zh-TW" class="theme-light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺味冰點 — 廚房</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/images/favicon.ico">
    <link rel="apple-touch-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/stylesheets/navi.css">
    <link rel="stylesheet" href="/stylesheets/page.css">
    <link rel="stylesheet" href="/stylesheets/toast.css">
    <link rel="stylesheet" href="/stylesheets/layer.css">
    <link rel="stylesheet" href="/stylesheets/@media.css">
    <link rel="stylesheet" href="/mods/light-theme/theme.css">
    <link rel="stylesheet" href="/pages/restaurant/css/style.css">
    <script>navigator.serviceWorker?.getRegistrations().then(rs => rs.forEach(r => r.unregister()))</script>
</head>

<body>
    <div class="header">
        <img src="/pages/restaurant/images/header.png" class="header-img" alt="臺味冰點">
    </div>
    <div class="body">
        <!-- Login gate -->
        <div id="kitchen-login-gate" style="display:none">
            <div id="kitchen-login-page"></div>
        </div>

        <nav class="navi-bar" id="kitchen-nav">
            <div class="navi-mask"></div>

            <!-- 廚房 -->
            <div class="navi-item" data-navi-item="kitchen" data-sound-main="UIGeneralCancel.mp3"
                data-sound-sub="UIGeneralFocus.mp3">
                <div class="navi-item-text" data-i18n="nav.kitchen">廚房</div>
                <div class="sub-navi-indicator"></div>
                <div class="sub-navi-container">
                    <div class="sub-navi-track">
                        <div class="sub-navi-item" data-sub-navi-item="kitchen-orders">
                            <div class="sub-navi-item-text" data-i18n="nav.kitchen-orders">訂單</div>
                        </div>
                        <div class="sub-navi-item" data-sub-navi-item="kitchen-history">
                            <div class="sub-navi-item-text" data-i18n="nav.kitchen-history">歷史</div>
                        </div>
                        <div class="sub-navi-item" data-sub-navi-item="kitchen-menu">
                            <div class="sub-navi-item-text" data-i18n="nav.kitchen-menu">菜單管理</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 外送員 -->
            <div class="navi-item" data-navi-item="deliverer" data-sound-main="UIGeneralCancel.mp3"
                data-sound-sub="UIGeneralFocus.mp3">
                <div class="navi-item-text" data-i18n="nav.deliverer">外送員</div>
                <div class="sub-navi-indicator"></div>
                <div class="sub-navi-container">
                    <div class="sub-navi-track">
                        <div class="sub-navi-item" data-sub-navi-item="deliverer-list">
                            <div class="sub-navi-item-text" data-i18n="nav.deliverer-list">列表</div>
                        </div>
                        <div class="sub-navi-item" data-sub-navi-item="deliverer-register">
                            <div class="sub-navi-item-text" data-i18n="nav.deliverer-register">註冊</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 控制臺 -->
            <div class="navi-item" data-navi-item="console" data-sound-main="UIGeneralCancel.mp3"
                data-sound-sub="UIGeneralFocus.mp3">
                <div class="navi-item-text" data-i18n="nav.console">控制臺</div>
                <div class="sub-navi-indicator"></div>
                <div class="sub-navi-container">
                    <div class="sub-navi-track">
                        <div class="sub-navi-item" data-sub-navi-item="dev-tools">
                            <div class="sub-navi-item-text" data-i18n="nav.dev-tools">工具</div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        <div class="sub-navi-indicator-mask"></div>
        <script type="module" src="/javascript/navi.js"></script>
        <script type="module">
            import { initI18n } from '../js/i18n.js';
            import { initCart } from '../js/cart.js';
            await initI18n();
            await initCart();

            const v = Date.now();
            const { BRANCH } = await import(`../js/branch.js?v=${v}`);
            window.__kitchenBranch = BRANCH;

            let session = null;
            try { session = JSON.parse(localStorage.getItem('kitchen-session')); } catch {}

            if (!session || session.code !== BRANCH) {
                localStorage.removeItem('kitchen-session');
                document.getElementById('kitchen-nav').style.display = 'none';
                document.querySelector('.sub-navi-indicator-mask').style.display = 'none';
                document.getElementById('page-container').style.display = 'none';
                document.getElementById('kitchen-login-gate').style.display = '';
                import(`../js/lang-toggle.js?v=${v}`).then(m => m.initLangToggle());
                import(`../js/kitchen-login.js?v=${v}`);
            } else {
                import(`../js/lang-toggle.js?v=${v}`).then(m => m.initLangToggle());
                import(`../js/restaurant-echo.js?v=${v}`).then(m => m.initRestaurantEcho());
                import(`../js/kitchen-page.js?v=${v}`);
                import(`../js/kitchen-history-page.js?v=${v}`);
                import(`../js/kitchen-menu-page.js?v=${v}`);
                import(`../js/kitchen-deliverer-page.js?v=${v}`);
                import(`../js/kitchen-register-page.js?v=${v}`);
                import(`../js/kitchen-console-page.js?v=${v}`);
            }
        </script>
        <div class="page-container" id="page-container">

            <!-- ====== 廚房 pages ====== -->
            <div class="page" data-page="kitchen-orders" id="kitchen-orders-page"></div>
            <div class="page" data-page="kitchen-history" id="kitchen-history-page"></div>
            <div class="page" data-page="kitchen-menu" id="kitchen-menu-page"></div>

            <!-- ====== 外送員 pages ====== -->
            <div class="page" data-page="deliverer-list" id="deliverer-list-page"></div>
            <div class="page" data-page="deliverer-register" id="deliverer-register-page"></div>

            <!-- ====== 控制臺 pages ====== -->
            <div class="page" data-page="dev-tools" id="dev-tools-page"></div>

            <div id="toast-container"></div>
        </div>
    </div>
    <div class="footer">
        <div class="footer-text" data-i18n="footer.copyright">&copy; 2026 臺味冰點</div>
        <button id="lang-toggle" class="lang-toggle-btn"></button>
    </div>
</body>

</html>
