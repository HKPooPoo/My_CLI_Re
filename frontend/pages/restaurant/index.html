<!DOCTYPE html>
<html lang="zh-TW" class="theme-light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺味冰點</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/images/favicon.ico">
    <link rel="apple-touch-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/mods/light-theme/theme.css">
    <link rel="stylesheet" href="css/style.css">
    <script>navigator.serviceWorker?.getRegistrations().then(rs => rs.forEach(r => r.unregister()))</script>
    <style>
        .landing-container {
            width: var(--container-width);
            max-width: var(--container-max-width);
            margin: 24px auto;
            gap: 12px;
        }
        .landing-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border: var(--border-line);
            border-radius: var(--border-radius);
            background: var(--bg-primary);
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s;
        }
        .landing-card:hover {
            border-color: var(--text-green);
        }
        .landing-card-icon {
            width: 44px;
            height: 44px;
            border: 2px solid var(--text-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-green);
            flex-shrink: 0;
        }
        .landing-card-text { gap: 2px; }
        .landing-card-title {
            font-weight: bold;
            font-size: calc(var(--font-size) + 0.15rem);
        }
        .landing-card-desc {
            font-size: 0.85em;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="images/header.png" class="header-img" alt="臺味冰點">
    </div>
    <div class="body">
        <div class="landing-container">
            <a href="menu/" class="landing-card">
                <div class="landing-card-icon">C</div>
                <div class="landing-card-text">
                    <div class="landing-card-title" data-i18n="nav.order">點餐</div>
                    <div class="landing-card-desc" data-i18n="landing.order-desc">瀏覽菜單、下單、查看訂單歷史</div>
                </div>
            </a>
            <a href="kitchen/" class="landing-card">
                <div class="landing-card-icon">K</div>
                <div class="landing-card-text">
                    <div class="landing-card-title" data-i18n="nav.kitchen">廚房</div>
                    <div class="landing-card-desc" data-i18n="landing.kitchen-desc">接單、備餐、管理菜單</div>
                </div>
            </a>
            <a href="delivery/" class="landing-card">
                <div class="landing-card-icon">D</div>
                <div class="landing-card-text">
                    <div class="landing-card-title" data-i18n="nav.delivery">外送</div>
                    <div class="landing-card-desc" data-i18n="landing.delivery-desc">掃碼取餐、配送追蹤</div>
                </div>
            </a>
            <a href="console/" class="landing-card">
                <div class="landing-card-icon">X</div>
                <div class="landing-card-text">
                    <div class="landing-card-title" data-i18n="nav.console">控制臺</div>
                    <div class="landing-card-desc" data-i18n="landing.console-desc">開發測試工具</div>
                </div>
            </a>
        </div>
    </div>
    <div class="footer">
        <div class="footer-text" data-i18n="footer.copyright">&copy; 2026 臺味冰點</div>
    </div>
    <script type="module">
        import { initI18n } from './js/i18n.js';
        await initI18n();
    </script>
</body>

</html>
