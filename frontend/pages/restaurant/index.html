<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺灣冰點</title>
    <meta name="theme-color" content="#000000">
    <script>window.addEventListener('unhandledrejection', e => console.error('[Unhandled]', e.reason))</script>
    <link rel="icon" href="/images/favicon.ico">
    <link rel="apple-touch-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/stylesheets/crt-vfx.css">
    <link rel="stylesheet" href="/stylesheets/navi.css">
    <link rel="stylesheet" href="/stylesheets/page.css">
    <link rel="stylesheet" href="/stylesheets/toast.css">
    <!--注意@media放在尾！！！-->
    <link rel="stylesheet" href="/stylesheets/@media.css">
    <link rel="stylesheet" href="/stylesheets/layer.css">
    <link rel="stylesheet" href="/stylesheets/caret.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function () {
            var theme = localStorage.getItem('restaurant-theme') || 'light';
            if (theme === 'light') {
                document.documentElement.classList.add('theme-light');
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.id = 'light-theme-css';
                link.href = '/mods/light-theme/theme.css';
                document.head.appendChild(link);
            }
        })();
    </script>
</head>

<body>
    <div class="header">
        <img src="/images/banner.webp" class="header-img" alt="banner in header">
        <button id="theme-change-btn" aria-label="Toggle theme"></button>
    </div>
    <div class="body">
        <div class="crt-scanner"></div>
        <div class="crt-noise-layer"></div>
        <nav class="navi-bar crt-text-green">
            <div class="navi-mask"></div>
            <div class="navi-item" data-navi-item="restaurant" data-sound-main="UIGeneralCancel.mp3"
                data-sound-sub="UIGeneralFocus.mp3">
                <div class="navi-item-text">臺灣冰點</div>
                <div class="sub-navi-indicator"></div>
                <div class="sub-navi-container">
                    <div class="sub-navi-track">
                        <div class="sub-navi-item" data-sub-navi-item="menu">
                            <div class="sub-navi-item-text">菜單</div>
                        </div>
                        <div class="sub-navi-item" data-sub-navi-item="cart">
                            <div class="sub-navi-item-text">購物車</div>
                        </div>
                        <div class="sub-navi-item" data-sub-navi-item="order">
                            <div class="sub-navi-item-text">訂單</div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        <div class="sub-navi-indicator-mask"></div>
        <script type="module" src="js/app.js"></script>
        <div class="page-container" id="page-container">
            <div class="page" data-page="menu">
            </div>
            <div class="page" data-page="cart">
            </div>
            <div class="page" data-page="order">
            </div>
            <div id="toast-container"></div>
        </div>
    </div>
    <div class="footer">
        <div class="footer-text">&copy; 2026 臺灣冰點</div>
    </div>
</body>

</html>
