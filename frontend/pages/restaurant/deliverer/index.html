<!DOCTYPE html>
<html lang="zh-TW" class="theme-light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺味冰點 — 外送</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/images/favicon.ico">
    <link rel="apple-touch-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/stylesheets/navi.css">
    <link rel="stylesheet" href="/stylesheets/page.css">
    <link rel="stylesheet" href="/stylesheets/toast.css">
    <link rel="stylesheet" href="/stylesheets/layer.css">
    <link rel="stylesheet" href="/stylesheets/@media.css">
    <link rel="stylesheet" href="/mods/light-theme/theme.css">
    <link rel="stylesheet" href="/pages/restaurant/css/style.css">
    <script>navigator.serviceWorker?.getRegistrations().then(rs => rs.forEach(r => r.unregister()))</script>
</head>

<body>
    <div class="header">
        <img src="/pages/restaurant/images/header.png" class="header-img" alt="臺味冰點">
    </div>
    <div class="body">
        <!-- Login gate: shown when not authenticated -->
        <div id="delivery-login-gate" style="display:none">
            <div id="delivery-login-page"></div>
        </div>

        <!-- Main UI: shown when authenticated -->
        <nav class="navi-bar" id="delivery-nav">
            <div class="navi-mask"></div>

            <!-- 外送 -->
            <div class="navi-item" data-navi-item="delivery" data-sound-main="UIGeneralCancel.mp3"
                data-sound-sub="UIGeneralFocus.mp3">
                <div class="navi-item-text" data-i18n="nav.delivery">外送</div>
                <div class="sub-navi-indicator"></div>
                <div class="sub-navi-container">
                    <div class="sub-navi-track">
                        <div class="sub-navi-item" data-sub-navi-item="delivery-scan">
                            <div class="sub-navi-item-text" data-i18n="nav.delivery-scan">掃碼</div>
                        </div>
                        <div class="sub-navi-item" data-sub-navi-item="delivery-task">
                            <div class="sub-navi-item-text" data-i18n="nav.delivery-task">任務</div>
                        </div>
                        <div class="sub-navi-item" data-sub-navi-item="delivery-history">
                            <div class="sub-navi-item-text" data-i18n="nav.delivery-history">歷史</div>
                        </div>
                    </div>
                </div>
            </div>

        </nav>
        <div class="sub-navi-indicator-mask"></div>
        <script type="module" src="/javascript/navi.js"></script>
        <script type="module">
            import { initI18n } from '../js/i18n.js';
            await initI18n();

            const v = Date.now();
            let session = null;
            try { session = JSON.parse(localStorage.getItem('deliverer-session')); } catch {}

            if (!session) {
                document.getElementById('delivery-nav').style.display = 'none';
                document.querySelector('.sub-navi-indicator-mask').style.display = 'none';
                document.getElementById('page-container').style.display = 'none';
                document.getElementById('delivery-login-gate').style.display = '';
                import(`../js/lang-toggle.js?v=${v}`).then(m => m.initLangToggle());
                import(`../js/delivery-login.js?v=${v}`);
            } else {
                import(`../js/lang-toggle.js?v=${v}`).then(m => m.initLangToggle());
                import(`../js/restaurant-echo.js?v=${v}`).then(m => m.initRestaurantEcho());
                import(`../js/delivery-page.js?v=${v}`);
                import(`../js/delivery-task-page.js?v=${v}`);
                import(`../js/delivery-history-page.js?v=${v}`);
            }
        </script>
        <div class="page-container" id="page-container">

            <!-- ====== 外送 pages ====== -->
            <div class="page" data-page="delivery-scan" id="delivery-scan-page"></div>
            <div class="page" data-page="delivery-task" id="delivery-task-page"></div>
            <div class="page" data-page="delivery-history" id="delivery-history-page"></div>

            <div id="toast-container"></div>
        </div>
    </div>
    <div class="footer">
        <div class="footer-text" data-i18n="footer.copyright">&copy; 2026 臺味冰點</div>
        <button id="lang-toggle" class="lang-toggle-btn"></button>
    </div>
</body>

</html>
