<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TODO: Change title -->
    <title>Page Template</title>
    <meta name="theme-color" content="#000000">
    <script>window.addEventListener('unhandledrejection', e => console.error('[Unhandled]', e.reason))</script>
    <link rel="icon" href="/images/favicon.ico">
    <link rel="apple-touch-icon" href="/images/favicon.ico">
    <!-- Shared CSS from main site (absolute paths) -->
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/stylesheets/crt-vfx.css">
    <link rel="stylesheet" href="/stylesheets/navi.css">
    <link rel="stylesheet" href="/stylesheets/page.css">
    <link rel="stylesheet" href="/stylesheets/toast.css">
    <!--注意@media放在尾！！！-->
    <link rel="stylesheet" href="/stylesheets/@media.css">
    <link rel="stylesheet" href="/stylesheets/layer.css">
    <link rel="stylesheet" href="/stylesheets/caret.css">
    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Anti-FOUC: default to light theme; read PAGE_ID-theme from localStorage -->
    <script>
        (function () {
            // TODO: Replace PAGE_ID with your page identifier (e.g. 'restaurant')
            var theme = localStorage.getItem('PAGE_ID-theme') || 'light';
            if (theme === 'light') {
                document.documentElement.classList.add('theme-light');
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.id = 'light-theme-css';
                link.href = '/mods/light-theme/theme.css';
                document.head.appendChild(link);
            }
        })();
    </script>
</head>

<body>
    <div class="header">
        <img src="/images/banner.webp" class="header-img" alt="banner in header">
        <button id="theme-change-btn" aria-label="Toggle theme"></button>
    </div>
    <div class="body">
        <!--crt-vfx.css-->
        <div class="crt-scanner"></div>
        <div class="crt-noise-layer"></div>
        <!--crt-vfx.css-->
        <!--navi.css-->
        <nav class="navi-bar crt-text-green">
            <div class="navi-mask"></div>
            <div class="navi-item" data-navi-item="navi1" data-sound-main="UIGeneralCancel.mp3"
                data-sound-sub="UIGeneralFocus.mp3">
                <div class="navi-item-text">NAVI1</div>
                <div class="sub-navi-indicator"></div>
                <div class="sub-navi-container">
                    <div class="sub-navi-track">
                        <div class="sub-navi-item" data-sub-navi-item="sub-navi-1">
                            <div class="sub-navi-item-text">SUB-NAVI-1</div>
                        </div>
                        <div class="sub-navi-item" data-sub-navi-item="sub-navi-2">
                            <div class="sub-navi-item-text">SUB-NAVI-2</div>
                        </div>
                        <div class="sub-navi-item" data-sub-navi-item="sub-navi-3">
                            <div class="sub-navi-item-text">SUB-NAVI-3</div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        <div class="sub-navi-indicator-mask"></div>
        <script type="module" src="js/app.js"></script>
        <div class="page-container" id="page-container">
            <!-- TODO: Page content for sub-navi-1 -->
            <div class="page" data-page="sub-navi-1">
            </div>
            <!-- TODO: Page content for sub-navi-2 -->
            <div class="page" data-page="sub-navi-2">
            </div>
            <!-- TODO: Page content for sub-navi-3 -->
            <div class="page" data-page="sub-navi-3">
            </div>
            <!-- Page scripts will be added here -->
            <!-- No MOD system in standalone pages -->
            <div id="toast-container"></div>
        </div>
    </div>
    <div class="footer">
        <div class="footer-text">&copy; 2026 My CLI | YU Shing Hei</div>
    </div>
</body>

</html>
