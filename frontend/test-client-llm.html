<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3 WebLLM Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #0a0a0a; color: #33ff33; padding: 16px; max-width: 600px; margin: 0 auto; }
  h1 { font-size: 1rem; margin-bottom: 8px; }
  .env { font-size: 0.7rem; color: #666; margin-bottom: 12px; word-break: break-all; }
  .env span { color: #33ff33; }
  .env .warn { color: #ff4444; }
  .env .ok { color: #33ff33; }
  label { display: block; font-size: 0.8rem; margin-top: 12px; color: #ff9933; }
  textarea, select, button, input { width: 100%; font-family: monospace; font-size: 0.9rem; margin-top: 4px; padding: 8px; background: #111; color: #33ff33; border: 1px solid #33ff33; border-radius: 4px; }
  textarea { height: 100px; resize: vertical; }
  button { cursor: pointer; margin-top: 8px; font-weight: bold; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.danger { border-color: #ff4444; color: #ff4444; }
  button.warn { border-color: #ff9933; color: #ff9933; }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-row button { margin-top: 0; }
  #output { margin-top: 8px; background: #0d1a0d; min-height: 80px; }
  #cleanOutput { margin-top: 4px; background: #0d0d1a; min-height: 60px; color: #33ccff; border-color: #33ccff; }
  .metrics { margin-top: 12px; font-size: 0.75rem; color: #999; }
  .metrics span { color: #33ff33; }
  .config-row { display: flex; gap: 8px; align-items: end; }
  .config-row > div { flex: 1; }
  #log { margin-top: 12px; font-size: 0.7rem; color: #ff9933; background: #111; border: 1px solid #333; border-radius: 4px; padding: 8px; height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>

<h1>QWEN3 WebLLM TEST</h1>
<div class="env" id="envInfo">Detecting environment...</div>

<label>MODEL</label>
<select id="model">
  <option value="Qwen3-0.6B-q4f16_1-MLC" selected>Qwen3-0.6B (1.4GB)</option>
  <option value="Qwen3-1.7B-q4f16_1-MLC">Qwen3-1.7B (2.0GB)</option>
  <option value="Qwen3-4B-q4f16_1-MLC">Qwen3-4B (3.4GB)</option>
</select>

<div class="btn-row">
  <button id="loadBtn">LOAD</button>
  <button id="deleteBtn" class="danger" disabled>DELETE</button>
</div>

<label>THINKING MODE</label>
<div class="config-row">
  <div>
    <select id="thinkMode">
      <option value="disabled" selected>Disabled (fast)</option>
      <option value="enabled">Enabled (slow, better quality)</option>
    </select>
  </div>
  <div>
    <select id="thinkMethod">
      <option value="both">extra_body + /no_think</option>
      <option value="extra_body">/extra_body only</option>
      <option value="no_think">/no_think only</option>
      <option value="none">No suppression</option>
    </select>
  </div>
</div>

<label>TARGET LANGUAGE</label>
<select id="lang">
  <option value="繁體中文">繁中</option>
  <option value="简体中文">簡中</option>
  <option value="English">EN</option>
  <option value="日本語">日</option>
</select>

<label>PROMPT PREFIX (editable, prepended to input)</label>
<textarea id="sysPrompt" style="height:50px">翻譯成{{LANG}}：

</textarea>

<label>INPUT TEXT</label>
<textarea id="input">The quick brown fox jumps over the lazy dog. This is a test of client-side LLM translation running entirely in your browser.</textarea>

<div class="btn-row">
  <button id="translateBtn" disabled>TRANSLATE</button>
  <button id="summarizeBtn" disabled>SUMMARIZE</button>
  <button id="polishBtn" disabled>POLISH</button>
</div>
<button id="stopBtn" class="warn" disabled>STOP</button>

<label>RAW OUTPUT (includes think tags)</label>
<textarea id="output" readonly></textarea>

<label>CLEAN OUTPUT (think stripped)</label>
<textarea id="cleanOutput" readonly></textarea>

<div class="metrics">
  Load: <span id="metricLoad">-</span> |
  Total: <span id="metricTotal">-</span> |
  Think: <span id="metricThink">-</span> |
  Answer: <span id="metricAnswer">-</span> |
  Speed: <span id="metricSpeed">-</span>
</div>

<div class="btn-row" style="margin-top: 12px;">
  <button id="clearLogBtn" class="warn">CLEAR LOG</button>
  <button id="clearCacheBtn" class="danger">DELETE ALL CACHES</button>
</div>

<label>LOG</label>
<div id="log"></div>

<script type="module">
// --- Log helper ---
const logEl = document.getElementById('log');
function log(msg) {
  const ts = new Date().toLocaleTimeString();
  logEl.textContent += `[${ts}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

// --- Environment detection ---
const envEl = document.getElementById('envInfo');
const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(ua);
const hasWebGPU = !!navigator.gpu;

let envHTML = `Platform: <span>${isIOS ? 'iOS' : isAndroid ? 'Android' : 'Desktop'}</span> | `;
envHTML += `WebGPU: <span class="${hasWebGPU ? 'ok' : 'warn'}">${hasWebGPU ? 'YES' : 'NO'}</span> | `;
envHTML += `UA: <span>${ua.slice(0, 80)}</span>`;
envEl.innerHTML = envHTML;

log(`Platform: ${isIOS ? 'iOS' : isAndroid ? 'Android' : 'Desktop'}`);
log(`WebGPU: ${hasWebGPU ? 'supported' : 'NOT supported'}`);

if (!hasWebGPU) {
  log('FATAL: WebLLM requires WebGPU.');
  document.getElementById('loadBtn').disabled = true;
}

// --- Default system prompts per task ---
// Strategy: no system message, instruction embedded in user message
// Small models follow this better than system+user split
const DEFAULT_PROMPTS = {
  translate: `翻譯成{{LANG}}：\n\n`,
  summarize: `摘要以下文字：\n\n`,
  polish: `改善以下文字的文法和風格，保持原意：\n\n`,
};

// --- State ---
let engine = null;
let webllmModule = null;
let currentModelId = null;
let abortController = null;

const taskBtns = ['translateBtn', 'summarizeBtn', 'polishBtn'];
function setTaskBtnsEnabled(enabled) {
  taskBtns.forEach(id => document.getElementById(id).disabled = !enabled);
}

// --- Update prompt prefix when task buttons are clicked ---
function setPromptForTask(task) {
  document.getElementById('sysPrompt').value = DEFAULT_PROMPTS[task];
}

// --- Event listeners ---
document.getElementById('loadBtn').addEventListener('click', loadModel);
document.getElementById('deleteBtn').addEventListener('click', deleteModel);
document.getElementById('translateBtn').addEventListener('click', () => { setPromptForTask('translate'); doRun('translate'); });
document.getElementById('summarizeBtn').addEventListener('click', () => { setPromptForTask('summarize'); doRun('summarize'); });
document.getElementById('polishBtn').addEventListener('click', () => { setPromptForTask('polish'); doRun('polish'); });
document.getElementById('stopBtn').addEventListener('click', stopGeneration);
document.getElementById('clearLogBtn').addEventListener('click', () => { logEl.textContent = ''; });
document.getElementById('clearCacheBtn').addEventListener('click', clearAllCaches);

// --- Load model ---
async function loadModel() {
  const btn = document.getElementById('loadBtn');
  btn.disabled = true;
  const modelId = document.getElementById('model').value;

  try {
    if (!webllmModule) {
      log('Importing WebLLM from CDN...');
      webllmModule = await import('https://esm.run/@mlc-ai/web-llm');
      log('WebLLM imported OK.');
    }
    log(`Loading: ${modelId}...`);
    const t0 = performance.now();

    engine = await webllmModule.CreateMLCEngine(modelId, {
      initProgressCallback: (p) => log(p.text || JSON.stringify(p))
    });

    currentModelId = modelId;
    const elapsed = ((performance.now() - t0) / 1000).toFixed(1);
    document.getElementById('metricLoad').textContent = `${elapsed}s`;
    log(`Model ready in ${elapsed}s.`);
    setTaskBtnsEnabled(true);
    document.getElementById('deleteBtn').disabled = false;
  } catch (e) {
    log('LOAD ERROR: ' + e.message);
    log('Stack: ' + (e.stack || '').slice(0, 500));
  } finally {
    btn.disabled = false;
  }
}

// --- Delete model cache ---
async function deleteModel() {
  if (!currentModelId) return;
  log(`Deleting cached model: ${currentModelId}...`);
  try {
    const keys = await caches.keys();
    let deleted = 0;
    for (const key of keys) {
      if (key.includes('webllm') || key.includes('mlc') || key.includes('transformers')) {
        await caches.delete(key); log(`Deleted cache: ${key}`); deleted++;
      }
    }
    const dbs = await indexedDB.databases();
    for (const db of dbs) {
      if (db.name && (db.name.includes('webllm') || db.name.includes('mlc') || db.name.includes('model'))) {
        indexedDB.deleteDatabase(db.name); log(`Deleted IDB: ${db.name}`); deleted++;
      }
    }
    log(deleted ? `Deleted ${deleted} cache(s). Reload page.` : 'No caches found.');
    engine = null; currentModelId = null;
    setTaskBtnsEnabled(false);
    document.getElementById('deleteBtn').disabled = true;
  } catch (e) { log('DELETE ERROR: ' + e.message); }
}

// --- Clear all caches ---
async function clearAllCaches() {
  log('Deleting ALL caches...');
  try {
    for (const key of await caches.keys()) { await caches.delete(key); log(`Deleted: ${key}`); }
    for (const db of await indexedDB.databases()) { if (db.name) { indexedDB.deleteDatabase(db.name); log(`Deleted IDB: ${db.name}`); } }
    log('All caches cleared. Reload page.');
    engine = null; currentModelId = null;
    setTaskBtnsEnabled(false);
    document.getElementById('deleteBtn').disabled = true;
  } catch (e) { log('CLEAR ERROR: ' + e.message); }
}

// --- Stop ---
function stopGeneration() {
  if (abortController) { abortController.abort(); log('Interrupted.'); }
}

// --- Run task ---
async function doRun(task) {
  if (!engine) return;

  const input = document.getElementById('input').value.trim();
  const lang = document.getElementById('lang').value;
  const rawOut = document.getElementById('output');
  const cleanOut = document.getElementById('cleanOutput');
  const thinkMode = document.getElementById('thinkMode').value;
  const thinkMethod = document.getElementById('thinkMethod').value;

  if (!input) { log('No input text.'); return; }

  setTaskBtnsEnabled(false);
  document.getElementById('stopBtn').disabled = false;
  rawOut.value = '';
  cleanOut.value = '';

  // Build message
  let prefix = document.getElementById('sysPrompt').value.replace('{{LANG}}', lang);
  const userContent = prefix + input;

  const suppressThink = thinkMode === 'disabled';
  const useNoThink = suppressThink && (thinkMethod === 'both' || thinkMethod === 'no_think');
  const useExtraBody = suppressThink && (thinkMethod === 'both' || thinkMethod === 'extra_body');

  // Per Qwen3 docs: /no_think goes at START of content, not end
  const finalContent = useNoThink ? '/no_think\n' + userContent : userContent;

  log(`--- RUN ---`);
  log(`Model: ${currentModelId}`);
  log(`Task: ${task}${task === 'translate' ? ' → ' + lang : ''}`);
  log(`Think: ${thinkMode} | Method: ${thinkMethod}`);
  log(`Prompt: ${finalContent.slice(0, 200)}`);

  // Single user message (small models follow this better)
  const messages = [
    { role: 'user', content: finalContent },
  ];

  abortController = new AbortController();

  try {
    const t0 = performance.now();
    let thinkTokens = 0;
    let answerTokens = 0;
    let inThink = false;
    let rawText = '';
    let cleanText = '';

    const requestParams = {
      messages,
      temperature: 0.1,
      max_tokens: 1024,
      stream: true,
      stream_options: { include_usage: true },
    };

    // Apply extra_body based on config
    if (suppressThink && (thinkMethod === 'both' || thinkMethod === 'extra_body')) {
      requestParams.extra_body = { enable_thinking: false };
    }

    const chunks = await engine.chat.completions.create(requestParams);

    for await (const chunk of chunks) {
      if (abortController.signal.aborted) break;

      const delta = chunk.choices[0]?.delta?.content || '';
      if (!delta) {
        if (chunk.usage) log(`Usage: ${JSON.stringify(chunk.usage)}`);
        continue;
      }

      rawText += delta;
      rawOut.value = rawText;
      rawOut.scrollTop = rawOut.scrollHeight;

      // Track think state
      if (delta.includes('<think>')) { inThink = true; thinkTokens++; continue; }
      if (delta.includes('</think>')) { inThink = false; thinkTokens++; continue; }

      if (inThink) {
        thinkTokens++;
      } else {
        // Skip leading newlines after </think>
        const cleaned = cleanText ? delta : delta.replace(/^\n+/, '');
        if (cleaned) {
          cleanText += cleaned;
          cleanOut.value = cleanText;
          cleanOut.scrollTop = cleanOut.scrollHeight;
          answerTokens++;
        }
      }
    }

    const elapsed = ((performance.now() - t0) / 1000).toFixed(2);
    const tps = answerTokens > 0 ? (answerTokens / parseFloat(elapsed)).toFixed(1) : '0';

    document.getElementById('metricTotal').textContent = `${elapsed}s`;
    document.getElementById('metricThink').textContent = `${thinkTokens} tok`;
    document.getElementById('metricAnswer').textContent = `${answerTokens} tok`;
    document.getElementById('metricSpeed').textContent = `${tps} tok/s`;

    log(`Think: ${thinkTokens} tokens | Answer: ${answerTokens} tokens | Total: ${elapsed}s`);
    if (answerTokens === 0) log('WARNING: No answer tokens produced! Model only thought.');
  } catch (e) {
    if (e.name === 'AbortError') { log('Aborted.'); }
    else { log('ERROR: ' + e.message); log('Stack: ' + (e.stack || '').slice(0, 500)); }
  } finally {
    abortController = null;
    setTaskBtnsEnabled(true);
    document.getElementById('stopBtn').disabled = true;
  }
}
</script>

</body>
</html>
