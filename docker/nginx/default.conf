server {
    listen 80;
    server_name localhost;

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload size limit (aligned with PHP config)
    client_max_body_size 1g;

    # MOD discovery — JSON directory listing
    location = /mods/ {
        root /usr/share/nginx/frontend;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "public, max-age=5";
    }

    # SW must not be immutable-cached — browser needs to detect updates
    location = /sw.js {
        root /usr/share/nginx/frontend;
        add_header Cache-Control "no-cache";
    }

    # Restaurant pages — no-cache for active development
    location ^~ /pages/restaurant/ {
        root /usr/share/nginx/frontend;
        add_header Cache-Control "no-cache";
    }

    # Static asset caching (JS, CSS, images, fonts, audio)
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2|mp3|ico)$ {
        root /usr/share/nginx/frontend;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt — serve directly, not SPA fallback
    location = /robots.txt {
        root /usr/share/nginx/frontend;
    }

    # Frontend — static files
    location / {
        root /usr/share/nginx/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # File upload endpoint — streaming mode for large files
    location /api/files {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;

        # Streaming: don't buffer request body to disk
        fastcgi_request_buffering off;
        # Extended timeouts for large uploads
        fastcgi_read_timeout 3600;
        fastcgi_send_timeout 3600;
    }

    # LLM streaming — SSE, disable all buffering
    location = /api/mods/llm/chat/stream {
        fastcgi_pass api:9000;
        fastcgi_buffering off;
        fastcgi_request_buffering off;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
    }

    # Laravel API
    location /api {
        # Rewrite to Laravel's public/index.php
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;

        # Pass the original URI
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
    }

    # Reverb Websockets (variable defers DNS so nginx starts without reverb)
    resolver 127.0.0.11 valid=10s;
    set $reverb_upstream http://reverb:8081;
    location /app {
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
