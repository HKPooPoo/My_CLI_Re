# ============================================================
# MINIMAL DEPLOY (for MOD development only):
#   Only need: nginx, api, db, redis
#   Skip: pgadmin, mailpit, reverb, tunnel, queue, scheduler
#   Command: docker compose up -d nginx api db redis
# ============================================================

services:
  nginx:
    image: nginx:alpine
    container_name: my-cli-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/frontend:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: hkpoopoo/my-cli-re-api:latest
    container_name: my-cli-api
    volumes:
      - ./docker/entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ./backend:/var/www/html
      - file-storage:/var/www/html/storage/app/private/files
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./docker/php/zz-upload.conf:/usr/local/etc/php-fpm.d/zz-upload.conf:ro
    entrypoint: ["sh", "/usr/local/bin/docker-entrypoint.sh"]
    command: ["php-fpm"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      GG_API: ${GG_API}
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SESSION_LIFETIME: 525600
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-admin@my-cli.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MyCLI_System}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-my-cli}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-my-cli-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-my-cli-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8081
      REVERB_SCHEME: http
      OLLAMA_HOST: ${OLLAMA_HOST:-ollama}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:80,127.0.0.1,my-cli.uk
      RESTAURANT_DB: ${RESTAURANT_DB:-postgres}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  queue:
    image: hkpoopoo/my-cli-re-api:latest
    container_name: my-cli-queue
    volumes:
      - ./docker/entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ./backend:/var/www/html
    entrypoint: ["sh", "/usr/local/bin/docker-entrypoint.sh"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      GG_API: ${GG_API}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-admin@my-cli.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MyCLI_System}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-my-cli}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-my-cli-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-my-cli-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8081
      REVERB_SCHEME: http
    command: php artisan queue:listen --tries=3 --timeout=120
    depends_on:
      - db
      - redis
    restart: unless-stopped

  scheduler:
    image: hkpoopoo/my-cli-re-api:latest
    container_name: my-cli-scheduler
    volumes:
      - ./docker/entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ./backend:/var/www/html
      - file-storage:/var/www/html/storage/app/private/files
    entrypoint: ["sh", "/usr/local/bin/docker-entrypoint.sh"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: php artisan schedule:work
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: my-cli-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5431:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: my-cli-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: my-cli-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit
    container_name: my-cli-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  reverb:
    image: hkpoopoo/my-cli-re-api:latest
    container_name: my-cli-reverb
    volumes:
      - ./docker/entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ./backend:/var/www/html
    entrypoint: ["sh", "/usr/local/bin/docker-entrypoint.sh"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: ${REVERB_APP_ID:-my-cli}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-my-cli-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-my-cli-secret}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8081
      REVERB_HOST: reverb
      REVERB_PORT: 8081
      REVERB_SCHEME: http
      BROADCAST_CONNECTION: reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    depends_on:
      - api
      - db
      - redis
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: my-cli-tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TOKEN}
    depends_on:
      - nginx

  ollama:
    image: ollama/ollama:latest
    container_name: my-cli-ollama
    entrypoint: ["sh", "/ollama-entrypoint.sh"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./docker/ollama-entrypoint.sh:/ollama-entrypoint.sh:ro
    environment:
      - OLLAMA_MODEL=qwen3.5:4b
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_QUEUE=2
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_KV_CACHE_TYPE=q4_0
      - OLLAMA_CONTEXT_LENGTH=4096
    deploy:
      resources:
        limits:
          memory: 12g
        reservations:
          memory: 2g
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  db-data:
  pgadmin-data:
  redis-data:
  file-storage:
  ollama-data:
